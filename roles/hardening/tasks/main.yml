---
- name: update apt cache and install security packages
  ansible.builtin.apt:
    update_cache: true
    name:
    - ufw
    - fail2ban
    - python3-systemd
    - unattended-upgrades
    state: present

- name: deploy hardened ssh config
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0600"
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes
      MaxAuthTries 3
    validate: "/usr/sbin/sshd -t -f %s"
  notify: restart ssh

- name: configure fail2ban to use systemd journal backend
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
    content: |
      [DEFAULT]
      backend = systemd

      [sshd]
      enabled = true
  notify: restart fail2ban

- name: allow ssh, http and https through ufw
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "22"
    - "80"
    - "443"

- name: enable ufw with default deny incoming
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming

- name: ensure fail2ban is enabled and running
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true